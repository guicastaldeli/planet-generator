server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    types {
        application/wasm wasm;
        application/octet-stream data;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(wasm|data)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}